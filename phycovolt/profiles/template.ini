; A new multimeter's profile: copy this file, fill every FILL_IN from the instrument's datasheet and
; user's guide, and give it a new name. A profile with a FILL_IN left is refused (spec 3.8, B.3).

[multimeter]
name = FILL_IN
source = FILL_IN              ; datasheet number, accuracy period, temperature, warm-up
overrange = FILL_IN           ; a range covers values up to this times its full scale (1.2 = 120 %)
distribution = rectangular    ; rectangular (limit ÷ √3) or normal-95 (limit ÷ 2)
resolution = FILL_IN          ; displayed resolution, as a fraction of the range
terminal_voltage = FILL_IN
terminal_common = FILL_IN
terminal_current = FILL_IN

[connection]
transport = typed             ; serial | typed
port = FILL_IN
baud = FILL_IN
parity = none
data_bits = 8
stop_bits = 1
handshake = none
timeout_s = 5

[scpi]
remote = FILL_IN
identify = *IDN?
configure_dc_voltage = FILL_IN
configure_dc_current = FILL_IN
read = FILL_IN

[dc_voltage]                  ; range (V) = % of reading + % of range
FILL_IN = FILL_IN

[dc_current]                  ; range (A) = % of reading + % of range
FILL_IN = FILL_IN
