; Agilent 34401A 6½-digit multimeter: the calibration reference (spec 2.2, 3.8, B.3).
; The accuracy table is the datasheet's 1-year specification. The connection and SCPI settings follow
; the user's guide; check them on the instrument's I/O menu before the first RS-232 session.

[multimeter]
name = Agilent 34401A
source = datasheet 5968-0162: 1-year accuracy, 23 ± 5 °C, after 1 h warm-up
overrange = 1.2               ; a range covers values up to 120 % of its full scale
distribution = rectangular    ; or normal-95 (limit ÷ 2) if the datasheet states the confidence
resolution = 1e-6             ; displayed resolution, as a fraction of the range (6½ digits)
terminal_voltage = HI
terminal_common = LO
terminal_current = I

[connection]
transport = serial            ; serial | typed (usbtmc later)
port = /dev/ttyUSB0           ; COM3 or similar on Windows
baud = 9600                   ; as set in the instrument's I/O menu
parity = none
data_bits = 8
stop_bits = 2                 ; the 34401A sends 2 stop bits
handshake = dtr_dsr           ; the 34401A is a DTE: a null-modem cable is needed
timeout_s = 5

[scpi]                        ; to confirm against the instrument's user's guide
remote = SYST:REM
identify = *IDN?
configure_dc_voltage = CONF:VOLT:DC {range}
configure_dc_current = CONF:CURR:DC {range}
read = READ?

[dc_voltage]                  ; range (V) = % of reading + % of range
0.1 = 0.0050 + 0.0035
1 = 0.0040 + 0.0007
10 = 0.0035 + 0.0005
100 = 0.0045 + 0.0006
1000 = 0.0045 + 0.0010

[dc_current]                  ; range (A) = % of reading + % of range
0.01 = 0.050 + 0.020
0.1 = 0.050 + 0.005
1 = 0.100 + 0.010
3 = 0.120 + 0.020
