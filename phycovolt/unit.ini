; The project's M1K: its measured values (spec 1.4 and appendix A.3).
; Read by hardware.load_unit; used by the simulator to rehearse with this unit's real errors.
; Another unit = another file. Volts, amperes, ohms, hertz.

[unit]
name = ADALM1000 of the project (rev D, firmware 2.17)
serial = 203120443752474B323430323830323
firmware = 2.17
hardware = D

; The unit's "true" errors: offset; gain+; gain-  (raw = true / gain + offset).
; From the measurements of 11 and 13/11/2026 and the analysis of 2026-11-20 (spec A.3).
[true_records]
a_measure_v = 0.00055, 1.02349, 1.0
a_measure_i = 0.000528, 1.0195, 1.0173
a_source_v = 0.00257, 1.0018, 1.0
a_source_i = -0.000389, 1.0084, 1.0083
b_measure_v = 0.00063, 1.02382, 1.0
b_measure_i = 0.000459, 1.0177, 1.0178
b_source_v = 0.00114, 1.0017, 1.0
b_source_i = -0.000646, 1.0089, 1.0096

; The simulator's EEPROM: the true records with these errors (offset in V or A; gain in ppm),
; so that a simulated calibration has something to correct.
[stored_calibration]
offset_shift = -10e-6
gain_shift_ppm = 40

; The real voltage of the fixed pins (H-04): 2.5V measured on 11, 13 and 18/11; 5V is the USB supply.
[pins]
gnd = 0.0
2.5v = 2.4457
5v = 4.9300                   ; this laptop's USB, warm (2026-11-21)

[measure]
open_input = 0.30             ; HI_Z with nothing connected: it floats from 0.25 to 0.35 V (H-12, 21/11)
current_zero_slope = -18e-6   ; A/V around 2.5 V (11/11; unstable on the board, H-07)

; The voltage source leaves its 0-2.5 V line near 5 V (H-06): how far below it, at 4.5 V
; (2026-11-21). Named by the calibration report; the simulator applies it only as a test hook.
[source_nonlinearity]
a = -0.29e-3
b = -1.37e-3

; The noise at rest, measured on 2026-11-21 (18 HI_Z bursts of 10 s, cold and warm; H-10, H-14).
[noise]
voltage_sigma_a = 64e-6       ; per sample, on GND
voltage_sigma_b = 43e-6
current_sigma = 58e-6
voltage_hum = 1e-6            ; amplitude of the mains hum: <= 1 uV on GND and the pins
current_hum = 0.2e-6
open_input_pickup = 1e-3      ; an open HI_Z input picks up ~1 mV from the room
mains = 60
voltage_slow = 2e-6           ; slow noise: spread of 100 ms block means (rest on GND)
current_slow = 3e-6           ; not measured on 21/11: the 18/11 readings' value
block_correlation = 0.65      ; lag-1 correlation of neighbouring block means (H-14)
